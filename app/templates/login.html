{% extends "base.html" %}{% block body %}
<style>
    /* Cool CSS Background */
    body {
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
    }
    
    /* Hide the default navbar on the login page */
    .navbar { display: none !important; }

    /* Glassmorphism Login Card */
    .login-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        color: white;
    }

    .login-card h2 {
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 5px;
        color: #fff;
    }

    .login-subtitle {
        color: #94a3b8;
        font-size: 0.9rem;
        margin-bottom: 30px;
    }

    /* Custom Inputs */
    .form-control {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        border-radius: 10px;
        padding: 12px 15px;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        background: rgba(255, 255, 255, 0.1);
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        color: white;
    }

    label {
        font-size: 0.85rem;
        color: #cbd5e1;
        font-weight: 600;
        margin-bottom: 8px;
    }

    /* Button */
    .btn-login {
        background: linear-gradient(to right, #3b82f6, #6366f1);
        border: none;
        border-radius: 10px;
        padding: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
        margin-top: 10px;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
    }
    
    /* Alerts */
    .alert-danger {
        background: rgba(239, 68, 68, 0.2);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        border-radius: 10px;
        font-size: 0.9rem;
    }
</style>

<div class="login-card">
    <div class="text-center mb-4">
        <h2>DITS</h2>
        <div class="login-subtitle">Defect & Issue Tracking System</div>
    </div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
        {% for cat, m in msgs %}
            <div class="alert alert-danger mb-4">{{ m }}</div>
        {% endfor %}
    {% endwith %}

    <form method="post">
        <div class="mb-4">
            <label>Email Address</label>
            <input class="form-control" name="email" type="email" placeholder="e.g. lead@dits.test" required>
        </div>
        <div class="mb-4">
            <label>Password</label>
            <input class="form-control" name="password" type="password" placeholder="••••••••" required>
        </div>
        <button class="btn btn-primary w-100 btn-login">Sign In</button>
    </form>
    
    <div class="text-center mt-4" style="font-size: 0.8rem; color: #64748b;">
        Demo accounts: rep@dits.test / lead@dits.test<br>Password: pass123
    </div>
</div>
{% endblock %}
