{% extends "base.html" %}{% block body %}
<h3>Report a Defect</h3>
<form method="post">
  <div class="mb-3"><label>Title *</label>
    <input class="form-control" name="title" required></div>
  <div class="mb-3"><label>Description</label>
    <textarea class="form-control" name="description" rows="3"></textarea></div>
  <div class="mb-3"><label>Priority</label>
    <select class="form-control" name="priority">
      <option>Low</option><option selected>Medium</option>
      <option>High</option><option>Critical</option>
    </select></div>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
